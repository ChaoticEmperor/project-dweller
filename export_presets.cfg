[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
exclude_filter="web/*,Godot_*"
export_path="web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}#canvas{position:fixed;left:0;top:0}</style><script>(function(){var vv=window.visualViewport;if(vv){try{Object.defineProperty(window,\"innerWidth\",{configurable:true,get:function(){return Math.round(vv.width)}});Object.defineProperty(window,\"innerHeight\",{configurable:true,get:function(){return Math.round(vv.height)}})}catch(e){}}var t;function place(){var c=document.getElementById(\"canvas\");if(c&&vv){c.style.left=vv.offsetLeft+\"px\";c.style.top=vv.offsetTop+\"px\"}}function again(){place();clearTimeout(t);t=setTimeout(function(){place();window.dispatchEvent(new Event(\"resize\"))},350)}window.addEventListener(\"orientationchange\",again);document.addEventListener(\"fullscreenchange\",again);if(vv){vv.addEventListener(\"resize\",again);vv.addEventListener(\"scroll\",place)}document.addEventListener(\"DOMContentLoaded\",place)})();</script>"
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
