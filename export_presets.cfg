[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
exclude_filter="web/*,Godot_*"
export_path="web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}#canvas{position:fixed;left:0;top:0;max-width:100vw;max-height:100vh;max-height:100dvh}</style><script>(function(){var t;function again(){window.scrollTo(0,0);clearTimeout(t);t=setTimeout(function(){window.dispatchEvent(new Event(\"resize\"))},350)}window.addEventListener(\"orientationchange\",again);document.addEventListener(\"fullscreenchange\",again);if(window.visualViewport){window.visualViewport.addEventListener(\"resize\",function(){window.scrollTo(0,0)})}})();</script>"
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
